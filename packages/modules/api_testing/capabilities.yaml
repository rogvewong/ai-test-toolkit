module: api_testing
name: 接口测试
sop_hook: step4
priority_matrix:
  P0:
    - import_openapi_postman_har
    - case_generation_from_doc
    - functional_positive_negative
    - boundary_and_fuzz
    - permission_horizontal_vertical
    - dependency_graph_execution
    - change_impact_analysis
  P1:
    - contract_testing_pact
    - idempotency_replay
    - record_replay_desensitize
