# 质量标准 (Quality Standards)
# 准确率基线、置信度分级、黄金集、误报误漏阈值、SLO
version: "1.0.0"
last_updated: "2026-04-18"

accuracy_baselines:
  step1_requirement_breakdown:
    module_identification_f1: 0.90
    flow_extraction_f1: 0.85
    ambiguity_detection_recall: 0.90
  step2_testcase_design:
    p0_coverage: 1.00
    p1_coverage: 0.95
    p2_coverage: 0.85
    duplicate_rate_max: 0.05
  step4_api_testing:
    case_generation_precision: 0.92
    assertion_correctness: 0.95
    false_positive_rate_max: 0.05
    false_negative_rate_max: 0.03
  step5_ui_consistency:
    diff_detection_precision: 0.90
    diff_detection_recall: 0.88
    false_alarm_rate_max: 0.10
  step6_execution:
    action_success_rate: 0.92
    rca_accuracy: 0.80

confidence_grading:
  auto_pass:
    threshold: ">=0.90"
    action: "直接入库"
  suggest_review:
    threshold: "0.70 - 0.90"
    action: "标记建议复核但可通过"
  mandatory_review:
    threshold: "<0.70"
    action: "强制人工复核，不可自动通过"

golden_set:
  purpose: "防止 AI 输出回归"
  coverage_target: ">=200 samples per step"
  update_frequency: "每季度扩充，重大模型升级必跑"
  regression_gate:
    max_accuracy_drop: 0.03
    block_release_if_exceeded: true
  storage_path: "configs/golden_sets/"

slo:
  step1_requirement_breakdown:
    p95_latency_seconds: 60
    p99_latency_seconds: 120
  step2_testcase_design:
    p95_latency_seconds: 120
    p99_latency_seconds: 240
  step4_api_testing:
    p95_latency_seconds: 180
    p99_latency_seconds: 360
  step5_ui_consistency:
    p95_latency_seconds: 30
    p99_latency_seconds: 60
  step6_execution:
    p95_per_case_seconds: 30
  api_availability:
    monthly_target: 0.995
  error_budget_per_month_minutes: 216

idempotency:
  required_for: [step1, step2, step4, step5, step6]
  mechanism: "input_fingerprint + run_id"
  cache_ttl_days: 30

evidence_retention:
  logs_days: 90
  artifacts_days: 365
  golden_set_forever: true
  raw_inputs_days: 180

cost_guardrails:
  per_call_max_tokens: 8000
  per_run_max_usd: 5.0
  daily_budget_usd: 50.0
  alert_threshold_pct: 0.80

llm_output_validation:
  required_checks:
    - schema_conformance
    - required_fields_present
    - id_format_valid
    - enum_values_valid
    - cross_reference_integrity
  on_validation_failure:
    action: repair_prompt_then_retry
    max_retries: 2
