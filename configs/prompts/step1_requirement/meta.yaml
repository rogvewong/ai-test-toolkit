step_id: step1
name: 需求评审
version: 3.2.0

# 工具定性：分析型。只分析用户提供的 PRD / 原型 / UI 稿 / 交互文案 / 接口草案等文本，
# 无真实系统交互、无线上数据、无代码可读。因此严禁断言材料未写明的客观事实
# （线上行为 / 性能数字 / 是否已埋点 / 是否已建表 / 第三方真实表现等），
# 凡材料未触及一律标 needs_clarification / unknown，不臆造。

# ───────────────────────────────────────────────────────────────────────────
# 找洞核心模型（整个 step1 围绕它，5 个子步是它的 5 个工序）
# ───────────────────────────────────────────────────────────────────────────
# 找需求漏洞 = 拿一张「应然网格」去减「需求实际写到的」，差集就是洞；
# 每条洞再用「能不能写出验收用例」复验。
# 网格 = 三维叠加：
#   横轴 = 17 业务域（需求涉及哪些域 → 每域拆出哪些功能点）
#   纵轴 = 8 设计层（每个功能点要定义到多细）
#   每格用 5 种「找洞方法」扫 → 产出缺陷；缺陷归 6 类：遗漏/歧义/矛盾/不可测/隐含假设/边界未定义
# 主流程只是「①业务逻辑层 × 核心域」一小格——绝大多数洞在其余 7 层 × 其余域里。
#
# 纵轴 8 设计层（每个功能点逐层问「定义了没」）：
#   ① 业务逻辑：触发/正常/各异常分支/状态机/领域规则
#   ② UI 框架与信息架构：全局导航/tab/浮窗/弹窗在各页显隐、页面层级归属、组件一致性、布局自适应(折叠/横竖屏/系统字号/深色)
#   ③ 跳转/路由/导航：跳转关系、路由参数(缺失/非法/越权)、返回行为(回退栈/保留滚动与表单与筛选)、深链直达(未登录/无权/资源已删)、拦截回跳、外部唤起(分享/推送/扫码/UniversalLink)、tab 保状态、跳转中断(连点/转场中返回)
#   ④ 系统反馈/四态/弱网重连（PRD 头号重灾区）：四态(加载/空/错误/正常)逐页、错误码→文案映射表、成功反馈、loading 超时阈值与期间可否操作、防重复提交、二次确认、弱网降级/断网提示/重连(自动vs手动/重连后数据补偿/长连接断线重连/发送中与未发送数据→必须幂等避免重连重复提交)
#   ⑤ 数据呈现/一致性：字段空/null/超长/特殊字符/emoji、数字金额日期时区格式、默认值/默认排序/默认选中、多端多页同一数据同步、操作后列表/详情/角标实时刷新、缓存vs强刷、乐观更新失败回滚、图片视频加载失败占位
#   ⑥ 权限/可见性（逐元素）：角色/会员等级 × 每页每按钮每字段 的可见与可操作差异、无权时 隐藏vs置灰vs点击提示、功能开关/灰度/AB
#   ⑦ 全局/横切：多弹窗优先级与互斥、登录态变化对当前页影响、网络态、版本更新/强制升级/维护公告、首屏冷启动vs二次进入、多语言时区币种、无障碍
#   ⑧ 非功能：性能(并发/响应/长列表/容量)、安全(认证授权/敏感数据/截屏剪贴板/合规)、可观测(关键操作埋点/错误日志)、兼容(多端/WebView/新老版本与数据迁移)
#
# 5 种找洞方法（每格怎么扫）：
#   1. 可测性反推（最狠）：每条需求强制问「能写出单一可断言的验收用例吗?」写不出=模糊/遗漏/歧义。
#   2. 完整性对照：逐功能 × 8 层 × 17 域行规，差集即洞。
#   3. 一致性交叉：分散在各章节的同类规则集中核对、权限矩阵vs流程、术语/数值前后冲突。
#   4. 边界极值：每个输入/数量/时间/容量的 空/极小/极大/临界±1/非法。
#   5. 对抗「如果」：断网/重复点/并发改/越权/脏数据/三方不回/中途退出/资源已删/版本不兼容…怎么办。
#
# 17 业务域（横轴）：D-ACCT 账号与身份 / D-PAY 支付与交易 / D-SUB 订阅会员计费 /
#   D-CONTENT 内容与媒体 / D-SEARCH 搜索筛选排序推荐 / D-LIST 列表Feed分页 /
#   D-FILE 上传下载文件 / D-FORM 表单与CRUD / D-SOCIAL 社交互动 / D-MSG 消息与通知 /
#   D-AUTHZ 权限角色越权 / D-MKT 营销与增长 / D-FLOW 流程审核工单 /
#   D-PRIVACY 数据隐私合规 / D-I18N 国际化本地化 / D-INTEG 第三方集成 / D-GEN 通用质量。
#
# 6 类缺陷：遗漏 omission / 歧义 ambiguity / 矛盾 contradiction /
#   不可测 untestable / 隐含假设 implicit_assumption / 边界未定义 undefined_boundary。
#
# 克制度（扫描求全、报告求准）：8 层 × 17 域 × 逐功能 每格都过一遍（求全）；
#   但最终报告只列真洞——每条可证伪、打要害，不为凑数列「疑似」。
#   模糊/不可测本身就是洞（要报），但不要把「我没看懂」当成洞。

# ───────────────────────────────────────────────────────────────────────────
# 五步流水线：每一步是找洞模型的一道工序，层层深入。
# 文件名 + frontmatter name + 正文主题三者一致；代码按文件名与 id 路由，保持不变。
# 注意：编排器把 1_1~1_5 当**纯文本子步**独立跑（同一份 {{业务材料}} 喂每一步、
#   各步输出 JSON），步间不在运行时传数据。因此每个子步必须**先在内部自行复现**
#   上游工序（如 1_4 须先在内部完成 1_2 的功能点拆解与 1_3 的 8 层走查）再做本步工作；
#   各步 JSON schema 是「逻辑上的承接形状」——上一步产出什么形状、下一步就按那个形状去复现并扩展。
# ───────────────────────────────────────────────────────────────────────────
order:
  - 1_1_material_inventory.md      # 物料盘点 · 参照系来源 · 可测性基线
  - 1_2_module_breakdown.md        # 模块→功能点拆解（搭横轴）+ 每功能点标 域[] 与 角色[]
  - 1_3_flow_interaction.md        # 逐功能 × 8 层 完整性走查（正向扫，产出 layer_grid）
  - 1_4_gap_detection.md           # 找洞引擎：方法1/3/4/5 对抗深挖 + 17 域行规对照 + 6 类归档（核心）
  - 1_5_report_finalization.md     # 提测门禁定稿（gap 必上抛 + 统一报告契约 + 用例种子）

# 每步职责与产出（说明用，便于维护者理解层层深入的关系）
steps:
  - file: 1_1_material_inventory.md
    name: 物料盘点与可测性基线
    output_schema: step1_material_inventory
    produces: 物料清单 / 参照系来源(原型·设计稿·接口文档·历史事故·竞品) / 完整度评分 / 关键缺失 / 术语对齐 / 可测性基线 / 待澄清
    feeds: 为 1_2~1_4 提供「材料给了什么 + 能拿什么当参照系比对」的地基；标「连测都没法测」的硬缺失
  - file: 1_2_module_breakdown.md
    name: 模块与功能点拆解（搭横轴）
    output_schema: step1_module_breakdown
    produces: 模块 / 最小可测功能点(输入·输出·状态·校验) / 每功能点的 domains[](涉及哪些业务域)与 roles[](涉及哪些角色) / 状态机
    feeds: features[] 是网格横轴——为 1_3 提供「对哪些功能点逐 8 层走查」、为 1_4 提供「按哪些域对行规」
  - file: 1_3_flow_interaction.md
    name: 逐功能 × 8 层 完整性走查
    output_schema: step1_layer_grid
    produces: 对 1_2 每个功能点，逐 8 设计层(业务逻辑/UI框架/跳转路由/系统反馈四态弱网/数据呈现一致性/权限可见性/全局横切/非功能)的每个关键点标 defined/gap/not_applicable + quote
    feeds: layer_grid 是正向完整性扫的结果——为 1_4 提供「每格的 gap 清单」作为找洞起点；主流程与异常流并入①②③④层不丢
  - file: 1_4_gap_detection.md
    name: 找洞引擎（对抗深挖 + 17 域行规对照 + 6 类归档）
    output_schema: step1_gap_detection
    produces: 在 1_3 网格上再用方法1/3/4/5(可测性反推/一致性交叉/对抗如果/边界极值/17域行规对照)挖更隐蔽的洞；汇总 1_3 的 gap + 本步新洞，按 6 类缺陷归档去重，每条可证伪
    feeds: holes[] 是去重后的洞集——为 1_5 提供可直接采纳为 issue/blocker/clarification 的条目
    note: 内置「分域标准核查清单」作为方法4(完整性对照)的行规对照表——一份覆盖常见产品功能全集的通用业务域库（共 17 个域：D-ACCT 账号与身份 / D-PAY 支付与交易 / D-SUB 订阅会员计费 / D-CONTENT 内容与媒体 / D-SEARCH 搜索筛选排序推荐 / D-LIST 列表Feed分页 / D-FILE 上传下载文件 / D-FORM 表单与CRUD / D-SOCIAL 社交互动 / D-MSG 消息与通知 / D-AUTHZ 权限角色越权 / D-MKT 营销与增长 / D-FLOW 流程审核工单 / D-PRIVACY 数据隐私合规 / D-I18N 国际化本地化 / D-INTEG 第三方集成 / D-GEN 通用质量）。框架：先判定材料涉及哪些域 → 对涉及域的每个点逐条核查 PRD 是否定义清楚，没定义即开洞（gap 必上抛）；与 step2 的 2_3/2_4 共用同一份域库（口径一致）；该清单是最低覆盖基线非上限，材料涉及但清单未列的子点/子域自行类比展开。每条洞必须可证伪：引原文(或「全文未见X，已通读全文」)+ 为什么是洞(哪个场景会崩/什么后果)+ 补什么才算补全。
  - file: 1_5_report_finalization.md
    name: 提测门禁定稿
    output_schema: step1_gate_finalization
    produces: 可测性裁决 + 门禁决策 + 用例种子 + 统一报告契约（唯一对外出口）
    note: finalize 步，强制遵守下方「统一报告契约」；只引用契约不重抄完整 schema。严守「gap 必上抛」铁律——1_3 的每个 layer gap、1_4 的每个 domain/hole gap 都必须在最终 issues/risks/clarifications 有对应条目，不得无声丢弃。

common_system_suffix: |
  通用规则（所有子步遵守）：
  - 输出必须是合法 JSON，不要任何前后说明文字、不要 markdown 代码围栏外的内容。
  - 本工具是分析型：结论只能基于 {{业务材料}} 原文。严禁断言材料未写明的客观事实
    （线上行为 / 性能毫秒数 / 是否已埋点 / 是否已建表 / 第三方真实 SLA / 真机或浏览器实测）。
    凡材料未写明 → 标 needs_clarification 或 unknown，绝不臆造默认值当成事实。
  - evidence / quote 必须可追溯：引用材料的具体段落 / 字段名 / 页面名 / 控件名 / 章节标题，
    或在「该有而空白」处明确写「全文未见关于 X 的描述（已通读全文）」。
    泛指（如「PRD 提到」「文档说」）视为无效证据，会被丢弃。
  - 示例 JSON 里禁止写死具体数字（如 7天>10%、4.2s）；用占位符或 unknown，由材料决定。
  - severity 枚举：critical / high / medium / low / info。
  - confidence.score 在 [0,1]，自我保守评估。
  - 找洞模型贯穿全步：找需求漏洞 = 「应然网格(8 设计层 × 17 业务域 × 逐功能点)」减「需求实际写到的」，
    差集即洞；每条洞再用「能否写出单一可断言验收用例」复验。扫描求全（每格都过一遍）、报告求准
    （只列可证伪、打要害的真洞，不为凑数列「疑似」，但模糊/不可测本身就是洞要报）。
  - 出最终结论前强制自我复核：自问「8 层里漏扫了哪层？17 域里漏判了哪个域？还漏了哪些功能点 /
    分支 / 边界 / 失败模式 / 角色 / 环境？」逐项补全后再输出。宁可多挖一层，不可浅尝辄止。

  【8 设计层（纵轴，全步统一口径）】每个功能点逐层问「PRD 定义了没」：
    ① 业务逻辑：触发 / 正常 / 各异常分支 / 状态机 / 领域规则。
    ② UI 框架与信息架构：全局导航 tab 浮窗弹窗在各页显隐、页面层级归属、组件一致性、
       布局自适应（折叠屏 / 横竖屏 / 系统字号 / 深色模式）。
    ③ 跳转/路由/导航：跳转关系（谁能到谁）、路由参数（缺失 / 非法 / 越权）、
       返回行为（回退栈 / 保留滚动位置与已填表单与筛选）、深链直达（未登录 / 无权 / 资源已删已下架）、
       拦截回跳（无权→登录→回原页原上下文）、外部唤起（分享 / 推送 / 扫码 / Universal Link）、
       tab 保状态、跳转中断（连点 / 转场途中返回）。
    ④ 系统反馈/四态/弱网重连（PRD 头号重灾区）：四态（加载 / 空 / 错误 / 正常）逐页定义、
       错误码→用户文案映射表（非笼统「操作失败」）、成功反馈、loading 超时阈值与期间可否操作、
       防重复提交、二次确认（删除 / 支付 / 退出等不可逆）、弱网降级、断网提示、
       重连逻辑（自动重连 vs 手动重试 / 重连后数据补偿 / 长连接断线重连 /
       发送中与未发送数据处理→必须幂等避免重连重复提交）。
    ⑤ 数据呈现/一致性：字段空 / null / 超长 / 特殊字符 / emoji 显示、数字金额日期时区格式、
       默认值 / 默认排序 / 默认选中、多端多页同一数据同步、操作后列表 / 详情 / 角标实时刷新、
       缓存 vs 强刷、乐观更新失败回滚、图片视频加载失败占位。
    ⑥ 权限/可见性（逐元素）：角色 / 会员等级 × 每页每按钮每字段 的可见与可操作差异、
       无权时 隐藏 vs 置灰 vs 点击提示、功能开关 / 灰度 / AB。
    ⑦ 全局/横切：多弹窗优先级与互斥、登录态变化（登录 / 登出 / 过期）对当前页影响、网络态、
       版本更新 / 强制升级 / 维护公告、首屏冷启动 vs 二次进入差异、多语言时区币种、无障碍。
    ⑧ 非功能：性能（并发 / 响应 / 长列表 / 容量）、安全（认证授权 / 敏感数据 / 截屏剪贴板 / 合规）、
       可观测（关键操作埋点 / 错误日志）、兼容（多端 / WebView / 新老版本与数据迁移）。

  【5 种找洞方法（全步统一口径）】每格怎么扫：
    1. 可测性反推（最狠）：每条需求强制问「能写出单一可断言的验收用例吗?」写不出 = 模糊 / 遗漏 / 歧义。
    2. 完整性对照：逐功能 × 8 层 × 17 域行规，差集即洞。
    3. 一致性交叉：分散在各章节的同类规则集中核对、权限矩阵 vs 流程是否打架、术语 / 数值前后是否冲突。
    4. 边界极值：每个输入 / 数量 / 时间 / 容量的 空 / 极小 / 极大 / 临界 ±1 / 非法。
    5. 对抗「如果」：标准清单——断网 / 重复点 / 并发改 / 越权 / 脏数据 / 三方不回 / 中途退出 /
       资源已删 / 版本不兼容…怎么办。

  【6 类缺陷（全步统一归类）】
    遗漏 omission（材料完全没提）/ 歧义 ambiguity（提了但可多解）/ 矛盾 contradiction（前后打架）/
    不可测 untestable（写不出可断言用例）/ 隐含假设 implicit_assumption（默认成立未写）/
    边界未定义 undefined_boundary（边界 / 临界 / 极值 / 容量没定义）。

  【severity / priority 判定标准（全步统一）】
  - severity：
      critical = 主流程/核心功能无法正确实现、或会致数据/资金/安全事故、或造成全局性歧义；
      high     = 重要功能/分支会被错误实现、需绕行或大量返工；
      medium   = 次要/边缘，影响有限；
      low/info = 提示性、可后补。
  - priority：
      P0 = 阻塞提测，开测前必须澄清/修正；
      P1 = 上线前必须修；
      P2 = 可排期；
      P3 = 可选。
  - severity→priority 默认映射：critical→P0、high→P1、medium→P2、low/info→P3。

  【统一报告契约 · 单一来源 · 所有 finalize（_5_*）步骤强制遵守】
  最终步（1_5_report_finalization.md）输出顶层必须包含以下字段，缺一不可；
  中间步（1_1~1_4）只输出本步关心的子部分，不需要本契约的全部字段，
  且**不得**在顶层输出 issues / cases / risks / blockers（这些列表字段由系统跨子步累加，
  中间步若输出会污染最终报告）——中间步用本步自有字段名（如 holes / layer_grid）承载发现。
  finalize 步在其 .md 中**只引用本契约、不重抄完整 schema**，以本 meta.yaml 为唯一来源。
  ```json
  {
    "verdict": "通过 | 有条件通过 | 不通过",
    "verdict_summary": "一句话给老板看的关键结论 (≤120 字)",
    "gate_decision": {"action": "proceed | proceed_with_warning | reject_with_report", "reasons": ["..."]},
    "confidence": {"score": 0.0, "rationale": "..."},
    "risks": [
      {"id": "R-001", "title": "风险标题", "impact": "对业务/用户的影响范围", "why": "为什么是风险（基于哪段输入）", "severity": "critical|high|medium|low"}
    ],
    "blockers": [
      {"id": "B-001", "title": "阻碍继续的硬约束", "why_blocking": "为什么必须先处理", "what_to_unblock": "需要谁/做什么才能解开", "owner_role": "product|backend|frontend|test|devops|security|data", "estimated_hours": 0}
    ],
    "issues": [
      {
        "issue_id": "<MODULE-AREA-NNNN>", "title": "标题",
        "severity": "critical|high|medium|low|info",
        "priority": "P0|P1|P2|P3",
        "type": "main|exception|boundary|security|perf|compat|state|data|a11y",
        "module": "出现位置/接口/页面",
        "current_behavior": "材料现状（如『未定义』）",
        "expected_behavior": "应补什么/期望",
        "fix_suggestion": "怎么修/补",
        "reproduce_steps": ["步骤1", "步骤2"],
        "acceptance_criteria": "怎么验",
        "related_test_cases": ["<case id>"],
        "owner_role": "product|backend|frontend|test|devops|security|data",
        "estimated_hours": 0,
        "impact_scope": "影响面",
        "evidence": "来自材料的具体引用 / 上游步骤条目 id"
      }
    ],
    "cases": [
      {
        "id": "<case id>", "title": "...",
        "priority": "P0|P1|P2|P3",
        "type": "main|exception|boundary|security|perf|compat|state|data|a11y",
        "preconditions": "...", "steps": ["..."], "expected": "...",
        "automation_tag": "auto|semi_auto|manual",
        "status": "designed|executed_pass|executed_fail|skipped|blocked",
        "evidence": "..."
      }
    ]
  }
  ```

  【契约硬约束】
  - 字段分类统一用 `type`，禁止用 `kind`。type 枚举：main / exception / boundary / security / perf / compat / state / data / a11y。
  - 排序：issues 按 severity(critical>high>medium>low>info) × priority(P0>P1>P2>P3) 排序；cases 按 priority(P0→P3) 排序。
  - 空数组写 []，不省略字段。
  - verdict 与 gate_decision.action 必须一致映射：通过↔proceed、有条件通过↔proceed_with_warning、不通过↔reject_with_report。二者矛盾即结论无效。
  - blocker 严格定义（满足任一才入，否则归 issues 或 risks）：
      ① 主流程/核心功能不可用或无法设计可断言用例
      ② 严重安全/合规/数据正确性风险
      ③ 必须先解决才能继续后续测试（关键澄清未解、前置数据/环境/账号材料未交代）。
    一般体验问题、可绕过的小瑕疵、改进建议一律不算 blocker。
  - blockers 与 risks 区分：blockers = 不解开就不能继续；risks = 可能出问题但不阻塞当前流程。
  - 本工具为分析型、无真实执行能力：cases.status 只能为 `designed`，不得出现 executed_pass / executed_fail；
    不得因「未执行」把设计态用例当作缺陷计入 issues、不得让设计态用例影响 verdict。
  - 【gap 必上抛 · 找洞模型铁律】step1 找洞模型 = 8 层 × 17 域 × 逐功能；
    1_3 layer_grid 里每个 `status=gap` 的层格、1_4 里每个 `status=gap` 的域点与每条 hole，
    都必须在最终 issues / risks / clarifications 中有对应条目（可合并同类、可按严重度降级为
    risk 或 clarification，但**不得无声丢弃**）；若某 gap 经判断确实不适用本需求，须在对应条目
    写明「判定不适用的原因」。漏抛任一 gap 即视为定稿不合格、报告无效。

  【用例数克制】用例数量应反映需求复杂度，不要为凑数生成机械组合：
  - P0 主流程用例 ≤ 8 条（覆盖核心 happy path）。
  - P1 异常/边界用例 ≤ 20 条（按模块聚合，每模块 ≤ 5 条）。
  - P2/P3 用例 ≤ 30 条（仅当材料明确暗示长尾需求时输出）。
