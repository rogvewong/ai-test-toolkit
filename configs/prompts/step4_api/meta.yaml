step_id: step4
name: 接口测试
version: 3.1.0
tool_type: interactive
description: |
  交互型接口测试工具。Claude 通过 send_request(method,url,headers,body) **亲自真发 HTTP 请求**,
  拿到真实响应(状态码/头/体)后据此找 bug。一切结论必须基于 Claude 自己发出的真实请求与真实响应,
  严禁凭文档脑补。覆盖各类接口形态:协议(REST/GraphQL/gRPC-Web/WebSocket/SSE/Webhook/文件下载)、
  鉴权(无/Bearer-JWT/Cookie-Session/OAuth2/API-Key/HMAC/双向TLS)、内容类型(json/form/multipart/binary/xml)、
  分页(offset/page/cursor/scroll)与横切(限流/幂等/版本化/批量/缓存/压缩/CORS/HTTP方法语义);
  4_1 逐接口识别形态,4_2~4_4 在通用矩阵之上按形态追加测试点,凡材料涉及即测。
  真发请求的执行循环见 _execute.md。本工具不测性能(send_request 不返回耗时)。
order:
  - 4_1_interface_list.md   # 接口清单 + 形态识别 + 鉴权前置:盘点接口/参数/鉴权,逐接口打 form 标签(协议/鉴权/内容类型/分页/横切),真发探活确认可调地址与登录态
  - 4_2_functional.md       # 功能 + 契约逐接口真测:正常入参/必填/类型/枚举/响应字段契约/状态码语义/幂等 + 分形态(GraphQL/gRPC-Web/WS/SSE/Webhook/下载/multipart/版本化/批量/缓存/压缩/HTTP方法语义)
  - 4_3_security.md         # 安全真测:鉴权缺失/错误/越权读、注入(只读级)、敏感泄漏、CORS、限流、错误信息泄漏 + 分形态(JWT/Cookie-CSRF/OAuth2/API-Key/HMAC/mTLS、GraphQL introspection/字段级权限、上传安全/路径穿越、XXE、Webhook 验签/重放)
  - 4_4_boundary.md         # 边界/异常/容错真测:超长/空/极值/非法/并发/超时/重试 + 分形态(各分页风格首末超界、文件上传边界、批量部分成功/原子性、WS/SSE 连接边界、长轮询)
  - 4_5_conclusion.md       # 结论定稿:汇总真测结果(含分形态覆盖),统一报告契约 + 提测门禁
execute_script: _execute.md

common_system_suffix: |
  通用规则:
  - 输出必须是合法 JSON,禁止任何前后说明文字。
  - 本工具为**交互型**:Claude 通过 send_request 真发 HTTP 请求,结论只能基于真实请求与真实响应,严禁脑补。
  - case_id:AC-{MODULE:3}-{SERIAL:0000}(功能+契约)/ SEC-{MODULE:3}-{SERIAL:0000}(安全)/ BND-{MODULE:3}-{SERIAL:0000}(边界异常)/ EP-{MODULE:3}-{SERIAL:0000}(接口清单条目)。
  - 本工具**不测性能/时延**:send_request 不返回耗时,禁止输出 p50/p95/p99、吞吐量、QPS、RPS、错误率百分比等任何性能数字。
  - 注入类安全用例只用温和、只读、不破坏的探测向量,且仅在材料明示的测试环境真发;严禁对真实目标发破坏性 payload。
  - confidence.score 在 [0,1]。

  【用例去重铁律 · 所有子步(4_1~4_5)强制遵守】
  一个测试点 = 一条用例。**严禁把同一测试点拆成"实测现状条"+"应然预期条"两条用例。**
  - **唯一性键**:用例以 (接口 METHOD+path + 参数/字段 + 测试意图) 三元组唯一标识。三元组相同 → 永远只能有**一条**用例。
    例:`limit=abc`(GET /api/list 的 limit 参数 + 类型校验意图)无论实测/应然/在哪一步被想到,全流程只允许一条用例,**不得出现第 2、3 条**。
  - **现状与预期写进同一条用例的不同字段,不另起一条**:
      · 应有行为 → 写进该用例的 `expected`(单一可断言预期,如 "HTTP 400 且 $.code=invalid_param")。
      · 实测现状 → 写进该用例的 `evidence`(真实请求 → 真实状态码 + 响应字段/头原值)。
  - **实测现状 ≠ 应有行为时**:这一条用例 `status=executed_fail` + 开**一条**对应 issue;用例本身**仍只算一条**,绝不因"既要记现状又要记应然"而复制成两条。
  - **同义改写不算新用例**:仅措辞/标题不同但三元组相同(如"limit=abc 返回 500"与"limit=abc 应返回 400")是同一条,合并。
  - **定稿(4_5)最终去重**:按 (接口, 参数, 意图) 三元组对所有子步的 cases 做一次全局去重与合并;合并后 `cases` 的条数**必须等于真实不同测试点数**,不得用"观察条+应然条"灌水虚高覆盖。

  【安全护栏 · 交互型工具发任何请求前必须遵守】
  - prod 默认**只读**:除非材料明示是 test/staging 且允许写,否则只真发 GET/HEAD/OPTIONS。
  - 禁一切不可逆破坏写:不真发会真实删/改/扣的 DELETE/PUT/PATCH,不真发"下单/支付/付款/提交订单/发布/注销/清空/转账"类 POST;
    写类/幂等用例仅在测试环境真发,否则降级为 cases.status=designed(只设计不执行)。
  - 注入(SQLi/NoSQL/命令注入)、SSRF(内网地址如 169.254.169.254 / 127.0.0.1)、XXE、越权探测:
    只设计、只在材料明示的测试环境做**只读级**验证(看服务是否过滤),绝不对真实/生产目标发破坏性或打内网的 payload;越权仅取相邻 1-2 个 ID 证明问题,不批量、不修改他人数据。
  - 凭据保护:真实 token/密码/key 不回显、不写进任何 finding/用例/报告字段,用 <token> 占位脱敏;响应若回显凭据,只描述事实不抄原值。

  【统一报告契约 · 所有 finalize 步骤(4_5)强制遵守】
  最终步(4_5_conclusion.md)输出顶层必须包含以下字段,缺一不可;中间步(4_1~4_4)只输出本步关心的子部分(cases/issues/not_executed 等)。
  ```json
  {
    "verdict": "通过 | 有条件通过 | 不通过",
    "verdict_summary": "一句话给老板看的关键结论 (≤120 字)",
    "gate_decision": {"action": "proceed|proceed_with_warning|reject_with_report", "reasons": ["..."]},
    "confidence": {"score": 0.0, "rationale": "..."},
    "risks": [
      {"id": "R-001", "title": "风险标题", "impact": "对业务/用户的影响范围", "why": "为什么是风险(基于哪条真测结果)", "severity": "critical|high|medium|low"}
    ],
    "blockers": [
      {"id": "B-001", "title": "阻碍当前阶段继续的硬约束", "why_blocking": "为什么必须先处理", "what_to_unblock": "需要谁/做什么才能解开", "owner_role": "product|backend|frontend|test|devops|security|data", "estimated_hours": 0}
    ],
    "issues": [
      {
        "issue_id": "<MODULE-AREA-NNNN>", "title": "标题",
        "severity": "critical|high|medium|low|info",
        "priority": "P0|P1|P2|P3",
        "module": "出现位置/接口(METHOD path)",
        "current_behavior": "现状(真实响应:HTTP 码 + 关键字段)",
        "expected_behavior": "期望",
        "fix_suggestion": "怎么修",
        "reproduce_steps": ["真发 <METHOD URL> 入参 ...", "观察响应 ..."],
        "acceptance_criteria": "怎么验",
        "related_test_cases": ["AC-xxx / SEC-xxx / BND-xxx"],
        "owner_role": "...",
        "estimated_hours": 0,
        "impact_scope": "影响面",
        "evidence": "真实请求 → HTTP 码 + 触发问题的响应字段/头原值"
      }
    ],
    "cases": [
      {
        "id": "<AC-/SEC-/BND-xxx>", "title": "...",
        "priority": "P0|P1|P2|P3",
        "type": "main|exception|boundary|security|perf|compat",
        "preconditions": "...",
        "steps": ["真发 <METHOD URL> 入参 ..."],
        "expected": "...(单一可断言预期)",
        "automation_tag": "auto|semi_auto|manual",
        "status": "designed|executed_pass|executed_fail|skipped|blocked",
        "evidence": "真实请求 → HTTP 码 + 关键响应字段(designed 用例可留空字符串)"
      }
    ]
  }
  ```
  - 字段分类统一用 `type`,**禁止用 `kind`**。
  - issues 必须按 (severity, priority) 双键排序:critical>high>medium>low>info;同级内 P0>P1>P2>P3。
  - cases 必须按 priority (P0→P3) 排序。
  - 空数组写 `[]`,不要省略字段。
  - verdict 与 gate_decision.action 必须一致映射:通过↔proceed、有条件通过↔proceed_with_warning、不通过↔reject_with_report。二者矛盾即无效。
  - blockers 与 risks 区分:blockers 表示"不解开就不能继续";risks 表示"可能出问题但不阻塞当前流程"。

  【契约硬约束 v2 · 优先级 / 阻碍 / 证据 / 字段命名】
  - **priority 必填**:每条 issue / case 必须含 `priority`(P0/P1/P2/P3),缺则视作 P2,但不应主动省略。
  - severity/priority 判定标准:
      severity:critical=主流程不可用或数据/资金/安全受损;high=重要功能受损有绕行;medium=次要/边缘;low/info=提示。
      priority:P0=阻塞提测必修;P1=上线前修;P2=可排期;P3=可选。默认 critical→P0、high→P1、medium→P2。
  - **blocker 严格定义**:只有满足以下任一才能进 blockers,其它一律归 risks 或 issues:
      ① 主流程/核心接口真测不可用 ② 严重安全/合规/数据正确性缺陷 ③ 必须先解决才能继续(核心接口无可调地址、账号未开通等硬阻塞)。
    "一般体验问题、可绕行的小 bug、改进建议" 一律 **不算 blocker**。
  - **evidence 可追溯(交互型定义)**:`evidence` 必须指向 **Claude 真发的请求 + 拿到的真实响应**,写成
    "真实请求(METHOD URL + 关键入参) → HTTP 状态码 + 触发问题的响应字段/头原值"。
    **接口测试的 evidence 不使用"截图文件名"**;凡"文档提到…/需求说…"这类无真实响应支撑的泛指,视为无效证据。
  - **未执行不得影响结论**:交互型工具中,cases.status 标 executed_pass/executed_fail 时,evidence 必须指向真实执行记录里的具体请求/响应;
    没真发到的接口/用例只能 status=designed,**不得进 issues、不得影响 verdict**,需在 coverage.not_executed 说明原因。
  - **字段命名统一**:用 `type` 而非 `kind` 标注 issue/case 分类(type 枚举:main/exception/boundary/security/perf/compat/state/data/a11y;本工具不产 perf)。
