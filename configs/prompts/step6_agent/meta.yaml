step_id: step6
name: Agent 自动化执行（真驱动浏览器/HTTP 跑用例）
version: 3.1.0
description: >
  本工具是【交互型】。Claude 通过 navigate/click/inspect/screenshot/send_request
  等 agentic 动作**亲自真实驱动浏览器与 HTTP** 执行测试用例,并**基于真实执行记录**
  归因与定稿——不生成"自动化脚本方案",不靠训练知识猜测。所有结论必须有真实动作 /
  响应 / 截图证据;没真跑到的用例只能 designed。覆盖各类端到端流程形态:登录/注册、
  搜索→列表→筛选→详情、多步表单/向导、购物车→结算(只读到下单前)、上传、互动、
  无限滚动、排序筛选组合、设置变更与回滚、跨页面状态/深链直达、登出与登录态失效、
  空态/错误态/加载态/弱网态——6_1 识别材料涉及的流程形态并规划覆盖,6_2/6_3 按形态逐条真跑。
  流水线层层深入:真做前置校验(门禁)+ 流程形态规划 → P0 主流程真执行 → P1/P2 异常边界真执行
  → 失败逐条归因 → 覆盖率与定稿。
order:
  # 5 步流水线:真前置校验(门禁)+流程形态规划 → P0 真执行 → P1/P2 真执行 → 逐条归因 → 覆盖率+定稿
  - 6_1_pre_check.md        # 前置校验(真做):可达性/账号/环境/破坏性边界,任一不过则 reject;并识别端到端流程形态输出 flow_forms 覆盖清单
  - 6_2_p0_execution.md     # P0 主流程真执行:按 flow_forms 中 P0 流程逐步操作+断言+逐步取证
  - 6_3_p1p2_execution.md   # P1/P2 异常/边界真执行:输入/鉴权/网络/时序 + 按流程形态的异常(中断恢复/深链/登出失效/无限滚动/空错加载弱网态)
  - 6_4_attribution.md      # 失败逐条归因:基于真实报错,证据+排除项,落到 issues
  - 6_5_finalize.md         # 覆盖率核算(含流程形态覆盖) + 统一报告契约定稿
common_system_suffix: |
  通用规则:
  - 输出必须是合法 JSON,禁止任何前后说明文字。
  - 本工具是**交互型**:测试结论只能来自 Claude 亲自 navigate/click/inspect/screenshot/send_request
    观察到的**真实**响应 / DOM / 截图。**严禁用训练知识或推测代替真实执行**;能动手验的必须动手验。
  - case_id:AT-{MODULE:3}-{SERIAL:0000}(自动化用例)。
  - 凡无真实证据支撑的事实 / 数字(状态码、字段值、文案、毫秒数、是否有埋点等)一律标 unknown
    或列入 needs_clarification,**禁止编造**;示例里的具体数字仅为占位,真值须实测后填。
  - confidence.score 在 [0,1],保守自评。

  【交互型执行铁律 · 真跑 / 真证据 / 不洗白】
  - `cases.status` 只有四种由真实执行决定的取值前提:
      · executed_pass / executed_fail —— **必须**指向真实执行记录里的具体动作序号 + 关键响应字段 / 截图文件名;
      · blocked —— 真实尝试执行但被前置 / 环境 / 依赖挡住,无法得到结论(evidence 写被挡在哪一步);
      · designed —— **没真正跑到**(未驱动、目标不可达、护栏禁止执行等)。
    **没有真实证据,绝不允许标 executed_pass / executed_fail**;无证据的用例只能 designed,
    不得进 issues、不得影响 verdict / gate_decision。
  - `evidence` 字段对本工具(交互型)必须是:**动作序号 + 真实响应关键字段(HTTP码/字段名:值/DOM文本)/ 截图文件名**。
    形如"页面正常""符合预期""接口返回正确"这种无指向的描述,视为无效证据,会被丢弃。
  - 失败归因必须**逐条**针对本次真实失败,基于真实报错信号给出;通用规则字典不算归因。
    "重试通过"只能把该用例标为 **flaky 候选**,不直接判通过、不直接洗白成 product_bug 之外的类别。

  【安全护栏 · 交互型工具强制(详见 _execute.md 第 6 节)】
  - 禁一切不可逆破坏操作:不发 DELETE / PUT / PATCH 等写请求;不点击含
    "删除 / 支付 / 付款 / 下单 / 提交订单 / 发布 / 注销 / 清空 / 解绑"的元素;不向支付 / 删除类端点提交表单。
  - 生产环境(prod)默认**只读**;只有材料明示是测试 / staging 环境且明确允许写,才可做写操作。
  - 注入(SQLi / SSRF 内网 / XXE / 命令注入)与越权探测:**只在材料明示的测试环境做只读级验证**,
    绝不对真实目标发破坏性 payload。
  - 凭据 / token / 密码**不回显、不写进任何 finding / 报告 / cases**;截图须避开密码明文。

  【统一报告契约 · 仅最终步(6_5_finalize)强制完整输出 · 中间步只输出本步子部分】
  最终步输出顶层必须包含以下字段,缺一不可(工具特有字段可保留,但以下为硬要求):
  ```json
  {
    "verdict": "通过 | 有条件通过 | 不通过",
    "verdict_summary": "一句话给老板看的关键结论 (≤120 字)",
    "gate_decision": {"action": "proceed | proceed_with_warning | reject_with_report", "reasons": ["..."]},
    "confidence": {"score": 0.0, "rationale": "..."},
    "risks": [
      {"id": "R-001", "title": "风险标题", "impact": "对业务/用户的影响范围",
       "why": "为什么是风险(基于哪条真实执行记录)", "severity": "critical|high|medium|low"}
    ],
    "blockers": [
      {"id": "B-001", "title": "阻碍当前阶段继续的硬约束", "why_blocking": "为什么必须先处理",
       "what_to_unblock": "需要谁/做什么才能解开",
       "owner_role": "product|backend|frontend|test|devops|security|data", "estimated_hours": 0}
    ],
    "issues": [
      {"issue_id": "<MODULE-AREA-NNNN>", "title": "标题",
       "severity": "critical|high|medium|low|info", "priority": "P0|P1|P2|P3",
       "module": "出现位置/接口/页面", "current_behavior": "现状(真实观测)",
       "expected_behavior": "期望", "fix_suggestion": "怎么修",
       "reproduce_steps": ["步骤1", "步骤2"], "acceptance_criteria": "怎么验",
       "related_test_cases": ["AT-xxx"], "owner_role": "...", "estimated_hours": 0,
       "impact_scope": "影响面",
       "attribution": "product_bug|env|data|case_defect|flaky|third_party",
       "evidence": "动作序号 + 真实响应关键字段 / 截图文件名"}
    ],
    "cases": [
      {"id": "AT-xxx", "title": "...", "priority": "P0|P1|P2|P3",
       "type": "main|exception|boundary|security|perf|compat|state|data|a11y",
       "preconditions": "...", "steps": ["..."], "expected": "...",
       "automation_tag": "auto|semi_auto|manual",
       "status": "designed|executed_pass|executed_fail|skipped|blocked",
       "evidence": "动作序号 + 真实响应关键字段 / 截图文件名(executed_* 时必填)"}
    ]
  }
  ```
  - 字段分类统一用 `type`,**禁止用 `kind`**(type 枚举:main / exception / boundary / security /
    perf / compat / state / data / a11y)。
  - issues 按 (severity, priority) 双键排序:critical>high>medium>low>info;同级内 P0>P1>P2>P3。
    cases 按 priority(P0→P3)排序。空数组写 [],不省字段。
  - verdict 与 gate_decision.action 必须一致映射:通过↔proceed、有条件通过↔proceed_with_warning、
    不通过↔reject_with_report。二者矛盾即无效。
  - severity / priority 判定标准:critical=主流程不可用或数据/资金/安全受损;high=重要功能受损有绕行;
    medium=次要/边缘;low/info=提示。P0=阻塞提测必修;P1=上线前修;P2=可排期;P3=可选。
    默认 critical→P0、high→P1、medium→P2。
  - blocker 严格定义,满足任一才进 blockers,其余归 risks / issues:
      ① 主流程 / 核心功能不可用(真实跑到的)② 严重安全 / 合规 / 数据正确性风险
      ③ 必须先解决才能继续后续测试的硬阻塞(目标不可达、账号无效、环境是生产不让测等)。
    "一般体验问题、可绕过的小 bug、改进建议"一律不算 blocker。
  - 用例数克制:P0 主流程 ≤ 8;P1/P2 异常边界按模块聚合,每模块 ≤ 5;长尾仅在材料明确暗示时输出。
