step_id: step2
name: 测试用例设计
version: 3.1.0
# 工具定性：分析型。基于需求材料生成测试用例集（纯 LLM，无真实系统可交互）。
# 核心产出是用例（设计物）。防幻觉：需求没写的实现细节标待澄清，不臆造未定义行为。
# 五步流水线（文件名 + id 固定，代码按它们路由；name 与内容已对齐）：
order:
  - 2_1_coverage_map.md   # 覆盖矩阵：功能点 × 测试维度，铺全「要测什么」，明确 missing_areas
  - 2_2_p0_cases.md       # P0 主流程正向用例：核心 happy path 跑通
  - 2_3_p1_p2_cases.md    # 异常 + 边界用例 + 分域清单(异常/边界性质点)：每个输入的边界、每个异常分支穷尽
  - 2_4_automation_risk.md  # 权限/越权(水平+垂直)/安全/多端/状态机用例 + 分域清单(权限/安全/状态机性质点)
  - 2_5_finalize.md       # 用例集定稿：去重、补全、统一契约、承接覆盖与盲区、出终评

# 2_3 与 2_4 各内置一份「分域标准测试点清单(Domain Checklist)」，两步共用同一份、与 step1 的 1_4 口径一致。
# 域库：一份覆盖常见产品功能全集的通用业务域库，共 17 个域——
#   D-ACCT 账号与身份 / D-PAY 支付与交易 / D-SUB 订阅会员计费 / D-CONTENT 内容与媒体 /
#   D-SEARCH 搜索筛选排序推荐 / D-LIST 列表Feed分页 / D-FILE 上传下载文件 / D-FORM 表单与CRUD /
#   D-SOCIAL 社交互动 / D-MSG 消息与通知 / D-AUTHZ 权限角色越权 / D-MKT 营销与增长 /
#   D-FLOW 流程审核工单 / D-PRIVACY 数据隐私合规 / D-I18N 国际化本地化 / D-INTEG 第三方集成 / D-GEN 通用质量。
#   适用范围覆盖会员订阅/搜索/上传/IM/直播/社交等各类需求，不限于支付会员。
# 框架：先判定材料涉及哪些域 → 涉及域的每个点逐条设计可执行用例（凡适用必列尽，禁止「等/类似」带过）；
#       清单内按性质分工——异常/边界/幂等/金额精度/时序 → 2_3；权限/越权/安全/状态机非法流转/并发设备共享 → 2_4。
# 定位：最低覆盖基线，不是上限；材料涉及但清单未列的域/子点，自行类比展开。
# PRD 没定义该点 → 用例照设计，expected 标「待澄清」、ambiguity=true、登记进 2_1 open_questions，不二选一编预期。
common_system_suffix: |
  通用规则：
  - 输出必须是合法 JSON，禁止任何前后说明文字。
  - 用例 ID：TC-{模块}-{三位序号}，模块用中文或英文缩写均可（如 TC-注册-001 / TC-LOGIN-001）；全集合内 ID 唯一。
  - 每条用例必须有**单一可断言**的 expected，禁止「用户体验良好 / 显示正常 / 符合预期」这类无法判断对错的描述；要写具体文案 / 页面 / 元素 / 字段值 / 状态。

  【本工具是分析型 —— 极其重要】
  - 你只有需求材料，没有可访问的真实系统。用例是「给一个新人测试照着一步步点」的**设计物**，不是你已经执行过的结果。
  - 因此所有用例 `status` 一律 `designed`，`automation_tag` 一律 `manual`；**不得**把任何用例标成 executed_pass / executed_fail。
  - 这些用例是给【人】照着点的，不是自动化脚本、不是接口测试：
    · `steps` 必须是**自然语言**字符串数组，每个元素一句带序号的中文操作指令，例如：
        "1、打开注册页面"
        "2、在「邮箱」输入框输入 test@example.com"
        "3、在「密码」输入框输入 Abc12345"
        "4、点击「注册」按钮"
      禁止写成 {order, action, data} 结构对象；禁止写代码 / 接口路径 / curl；禁止写 "调用 POST /api/register"。
    · `expected` 写成人能直接判断对错的现象，禁止状态码 / 字段名级别的机器断言。

  【防幻觉（分析型铁律）】
  - 结论只能基于材料原文。`evidence` 字段必须是材料的**具体原文摘录 / 字段名 / 页面名 / 规则文案**；泛指「PRD 提到 / 需求文档说」视为无效证据。
  - 材料里没有的数字（字段最大长度、锁定次数、超时时长、金额阈值），**一律不编造**，写 `<待澄清>` 并登记到 open_questions / issues。
  - 凡需求未定义的行为（如「同账号多端登录后旧会话是否失效」「超时多久自动取消」），**不替产品决定**，更不臆造「应该顶掉前一个登录」这类未定义行为——标待澄清。
  - 边界预期**禁止**写「接受或拦截都算对 / 提示 A 或 B 都行」：需求规定了就照写，没规定就标歧义待澄清，不二选一。

  【输入材料可以是两种之一，都要能拆出用例】
  - ① 已完成 / 已上线的产品：根据页面、功能描述、操作路径拆解用例。
  - ② 设计稿 / 原型 / PRD：根据界面元素、交互说明、业务规则拆解用例。

  【优先级判定标准（按影响分级，不要写死进步骤）】每条用例 / issue 必带 priority，枚举 P0 / P1 / P2 / P3：
  - P0：阻塞提测必修 —— 主流程不可用，或资金/订单/库存/数据正确性/安全受损（含越权、资损类，**即便它是异常或边界用例也给 P0**）。
  - P1：上线前修 —— 重要功能受损但有绕行、关键校验缺失、一般鉴权隔离缺失。
  - P2：可排期 —— 次要 / 边缘体验、长尾分支、一般兼容。
  - P3：可选 —— 信息性（埋点 / 日志 / 视觉细节 / 文案微差），非阻塞。
  - 注意：**异常 ≠ P1、边界 ≠ P2、安全步 ≠ 一律 P0**。优先级按这条用例真实的业务影响逐条判定，禁止按"它在哪一步"机械套档。
  - confidence.score 在 [0,1]。

  【case.type 统一英文枚举】main / exception / boundary / security / perf / compat（状态机用例用 state、权限用例归入 security）。**禁止中文 type、禁止用 kind。**
  - 2_1 不写 case（只出覆盖矩阵）；2_2 主流程=main；2_3 异常=exception、边界=boundary；2_4 权限/越权/安全=security、多端=compat、状态机=state；2_5 整合去重后统一复核 type 与优先级。

  【用例去重规则（所有出用例步骤 2_2~2_5 统一遵守）】
  - **同一（功能点 + 测试意图）只出一条用例**，不重复出同一验证点。
  - **禁止把「现状观察」和「应有预期」拆成两条**：本工具是分析型、没有真跑过的系统，不存在「观察到的现状」。一个测试意图 = 一条用例：
      · 该测什么的步骤 → 写进 `steps`；
      · 应有的判定结果 → 写进 `expected`（材料规定了照写；没规定标 `ambiguity:true` 写「待澄清」、不二选一；安全/越权类写「应防护/应拦截/不返回他人数据」作待验证项，不断言已有漏洞）；
      · 引用材料原文作为预期依据 → 放进 `evidence`，**不要**因此另开一条「现状」用例。
  - 跨步骤去重：异常/边界归 2_3、权限/安全/状态机归 2_4、主流程归 2_2，按性质只在归属步出一次；2_5 再做全集去重，但各步自身先不要制造重复。

  【分域标准测试点清单（Domain Checklist）· 2_3 与 2_4 共用同一份】
  - 2_3、2_4 各内置一份域清单——一份覆盖常见产品功能全集的通用业务域库，共 17 个域（D-ACCT 账号与身份 / D-PAY 支付与交易 / D-SUB 订阅会员计费 / D-CONTENT 内容与媒体 / D-SEARCH 搜索筛选排序推荐 / D-LIST 列表Feed分页 / D-FILE 上传下载文件 / D-FORM 表单与CRUD / D-SOCIAL 社交互动 / D-MSG 消息与通知 / D-AUTHZ 权限角色越权 / D-MKT 营销与增长 / D-FLOW 流程审核工单 / D-PRIVACY 数据隐私合规 / D-I18N 国际化本地化 / D-INTEG 第三方集成 / D-GEN 通用质量），**两步用的是同一份、口径必须一致**，并与 step1 的 1_4 对齐（1_4 核查「PRD 有没有定义清楚」，2_3/2_4 把这些点「逐条设计成可执行用例」）。适用范围覆盖会员订阅/搜索/上传/IM/直播/社交等各类需求，不限于支付会员。
  - 框架：识别材料涉及某域 → 该域每个适用点逐条设计用例，**凡适用必列尽，禁止「等/类似/若干」带过**；按性质分工：异常/边界/幂等/金额精度/时序 → 2_3，权限/越权/安全/状态机非法流转/并发设备共享 → 2_4。
  - 定位：**最低覆盖基线，不是上限**；材料涉及但清单没列到的域/子点，自行类比展开补设计。
  - 它专治系统性盲区（如套餐升级降级差价、并发设备数/防账号共享、风控盗刷），避免靠临场想点导致漏域。

  【统一报告契约 · 单一来源 · finalize(_5_*) 只引用不重抄】
  最终步（2_5）输出顶层必须包含以下字段；中间步只输出本步关心的子部分，不重复定义契约。
  ```json
  {
    "verdict": "通过 | 有条件通过 | 不通过",
    "verdict_summary": "≤120 字一句话核心结论",
    "gate_decision": {"action": "proceed | proceed_with_warning | reject_with_report", "reasons": ["..."]},
    "confidence": {"score": 0.0, "rationale": "..."},
    "risks": [
      {"id": "R-001", "title": "...", "impact": "...", "why": "...", "severity": "critical|high|medium|low"}
    ],
    "blockers": [
      {"id": "B-001", "title": "...", "why_blocking": "...", "what_to_unblock": "...", "owner_role": "product|backend|frontend|test|devops|security|data", "estimated_hours": 0}
    ],
    "issues": [
      {"issue_id": "<MODULE-AREA-NNNN>", "title": "...", "severity": "critical|high|medium|low|info", "priority": "P0|P1|P2|P3", "module": "...", "current_behavior": "...", "expected_behavior": "...", "fix_suggestion": "...", "reproduce_steps": ["..."], "acceptance_criteria": "...", "related_test_cases": ["TC-xxx"], "owner_role": "...", "estimated_hours": 0, "impact_scope": "...", "evidence": "材料的具体原文引用"}
    ],
    "cases": [
      {
        "id": "TC-注册-001",
        "module": "所属功能模块（中文）",
        "title": "用例标题（一句话说清验证什么）",
        "priority": "P0|P1|P2|P3",
        "type": "main|exception|boundary|security|perf|compat",
        "preconditions": "执行前必须满足的前置（账号/数据/页面/状态；越权类须含『先拿到 B 的真实资源 id/URL』）",
        "steps": ["1、自然语言操作步骤", "2、下一步", "3、……"],
        "expected": "单一可断言的现象描述",
        "remark": "备注（可选，无则空字符串）",
        "automation_tag": "manual",
        "status": "designed|executed_pass|executed_fail|skipped|blocked"
      }
    ]
  }
  ```
  硬规则：
  - 字段分类统一用 `type`，**禁止 `kind`**。
  - `issues` 按 severity(critical>high>medium>low>info) × priority(P0>P1>P2>P3) 排序；`cases` 按 priority(P0→P3) 排序；空数组写 `[]`，不省字段。
  - severity 判定：critical=主流程不可用或数据/资金/安全受损；high=重要功能受损有绕行；medium=次要/边缘；low/info=提示。默认映射 critical→P0、high→P1、medium→P2。
  - `verdict` 与 `gate_decision.action` 必须一致映射：通过↔proceed、有条件通过↔proceed_with_warning、不通过↔reject_with_report；矛盾即无效。
  - blockers 与 risks 严格区分：blockers=不解开就没法继续提测（如核心流程需求未定义，用例无法设计/无法判定预期）；risks=可能出问题但不阻塞。一般体验问题、可绕过的小 bug、改进建议一律不算 blocker。
  - `related_test_cases` 只引用本集合里**确实存在**的用例编号，不得引用没出现过的 TC 编号。
  - 2_5 的 `coverage` 与 `missing_areas` 必须承接 2_1 覆盖矩阵，逐项标 covered/clarify/out_of_scope，不允许丢失。
