step_id: network_resilience
name: 弱网与断网测试
version: 3.2.0
# 工具定性：交互型 · 双阶段真测。
# Phase1(Python 采集器)：在 6 个网络档位(online/4g/fast_3g/slow_3g/2g/offline)+ 断网→恢复 load 首页，
#   产出结构化加载矩阵(覆盖 A 网络环境 + B 加载层：加载耗时/FCP/白屏/资源数/控制台错误)。
# Phase2(agentic，由 _execute.md 驱动)：在各限速档位下真驱动前端操作
#   (set_network 切档 + navigate/click/form_input 操作 + inspect 观察)，
#   看应用「对用户说了什么(C 用户提示 11 点)」「操作成没成、会不会资损(D 操作/写/资损)」。
# 两阶段结果都注入 documents 供 synthesize 分析。
# 能力边界(诚实)：只读为主——不做不可逆提交(支付/下单/删除)。
# 因此「弱网超时重试是否真重复扣款 / 是否幂等 / 离线写入队列 / 断网提交是否丢数据 / 重连只同步一次」等
#   后端写语义无法直接断言，只观察前端提示与防重表现，资损本身作为 risk 列出并注明
#   「需 step4_api(抓包重放) 或 step6_agent(测试环境执行) 验证」。
order:
  - net_1_scope.md         # 第1步 范围与档位规划：盘点待测页面 + 识别关键操作(登录/搜索/播放/下单) + 6 档位规划 + 用户提示11点核查清单 + 资损登记
  - net_2_weak.md          # 第2步 弱网逐档加载+加载态提示：4g/fast_3g/slow_3g/2g 真加载+真操作，记录加载耗时/白屏/资源/控制台(B) + 加载态C1/慢网分级C2/降级C7
  - net_3_offline.md       # 第3步 断网态+恢复+用户提示：offline 断网提示C4/超时C3/重试C6/恢复提示C8，友好提示 vs 空白崩溃，离线缓存，断网中只读操作
  - net_4_resilience.md    # 第4步 操作·写·资损+容错：写操作弱网提示C9/避免静默失败C11/弱网超时重试→重复提交重复扣款(幂等)/中途断网/关键流程各档走查/长连接重连/乐观更新回滚
  - net_5_finalize.md      # 第5步 容错定稿：按统一报告契约汇总双阶段实测，A/B/C/D 全范围核对，看不见的写语义/资损降为 risk 转交
common_system_suffix: |
  通用规则：
  - 所有输出必须是合法 JSON，禁止任何前后说明文字。
  - 严重度（severity）使用枚举：critical / high / medium / low / info。
  - 【网络档位枚举（仅这 6 档，与底层 CDP Network.emulateNetworkConditions 及 _NET_DRIVE_PROFILES 一一对应）】：
    online / 4g / fast_3g / slow_3g / 2g / offline。
    · online   = 不节流（基线 / 恢复目标）
    · 4g       = 下行~4Mbps 上行~3Mbps RTT~20ms（良好移动网）
    · fast_3g  = 下行~1.6Mbps 上行~750kbps RTT~150ms（快3G）
    · slow_3g  = 下行~400kbps 上行~400kbps RTT~400ms（慢3G）
    · 2g       = 下行~256kbps 上行~256kbps RTT~800ms（2G/极弱网）
    · offline  = 完全断网，所有请求失败
    CDP 无法模拟丢包率 / 网络抖动 / 中途切网 / flaky / 网络类型切换(WiFi↔4G) / DNS 失败 / TLS 错误 / captive portal / 真机切网 / 双卡 / VPN，
    禁止出现 packet_loss / unstable / high_latency / poor_2g / 3g / wifi / dns_failure / tls_failure / network_switch 等档位，
    这些场景只能作为「需真机或其他工具验证」的 risk 列出（标 unknown），本工具不真测、不据此下结论。
  - operation_id 必须遵循 NET-{AREA:3}-{SERIAL:0000}（AREA = SCP/WEAK/OFFL/RECV/FIN）。
  - case_id（cases[].id）必须遵循 NTC-{AREA:3}-{SERIAL:0000}（AREA 同上）。issue_id 用 NET-{AREA:3}-{SERIAL:0000}。
    全工具仅这一套 ID 规则，禁止再出现 NTW- / NTW-CHK / NTW-CON / NTW-RTY / NTW-CCH / NTW-QUE 等旧前缀。
  - 【双阶段执行口径】本工具两阶段真测：
    · Phase1(采集器) 在 6 档位 load 首页测加载矩阵 → 覆盖 A 网络环境 + B 加载层(加载耗时/FCP/白屏/资源数/控制台错误)。
    · Phase2(agentic，_execute.md 驱动) 在各限速档位真驱动前端操作 → 覆盖 C 用户提示层(11 点) + D 操作/写/资损层。
    Phase2 动作严格只有 5 个、名称一字不差：set_network / navigate / click / form_input / inspect，
    每轮输出 JSON 用 `action` 字段写动作名(不是 tool)、`args` 写参数，发现问题放 `finding`，done=true 收尾。
  - 【完整测试范围 A/B/C/D，定稿须逐层有结论】
    A 网络环境：online/4g/fast_3g/slow_3g/2g/offline + 断网→恢复；CDP 测不了的(丢包/抖动/中途切网/flaky/网络类型切换/真机)标 unknown/需真机。
    B 加载表现层：各档首屏加载耗时/FCP、白屏与否、加载完成、资源数、控制台错误。
    C 用户提示层(★重点，逐档/逐操作核查应用「对用户说了什么」11 点)：
      1 加载态提示 2 慢网分级提示 3 超时提示 4 断网提示 5 错误文案质量 6 重试提示 7 降级提示
      8 恢复提示 9 写操作弱网提示(进行中/成功/失败/防重复提交) 10 提示时机一致性
      11 ★避免静默失败(操作失败却无提示、用户以为成功——尤其支付/提交/兑换，弱网红线)。
    D 操作/写/资损层：写操作弱网行为、弱网超时重试→重复提交/重复扣款幂等(资损)、请求中途断网、
      关键流程各档走查(登录/搜索/播放/下单)、长连接重连、未完成操作恢复/数据补偿/乐观更新回滚。
  - 【证据铁律 · 交互型】结论只能基于 Claude 亲自动作观察到的真实结果；evidence 必须写
    「动作序号 + 网络档位 profile + 实测值(Phase2 inspect 的 toasts/bodyText/loadingEls/buttons 关键字段 或 Phase1 加载矩阵档位字段值)」。
    凡未真实切档真测到的页/档/操作，标 unknown 或留待测，禁止凭训练知识编造毫秒数/加载表现/用户提示，示例 JSON 里的数字均为占位 <实测后填>。
    cases.status 标 executed_pass/executed_fail 时 evidence 必须指向真实执行记录；没真跑到的只能 designed，不得进 issues、不得影响 verdict。
  - 【资损红线 · 诚实边界】弱网超时重试是否真重复提交/重复扣款、后端是否幂等、离线写入队列、断网提交是否真丢数据、
    重连后是否只同步一次 —— 属后端写语义，本工具只读为主、不做不可逆提交，看不见。
    Phase2 只观察前端「写操作弱网提示与防重表现」(C9：是否 disabled/转圈防重复点击、有无进行中/成功/失败回执)与「是否静默失败」(C11)；
    资损本身作为 risk 列出，actual 注明「未真实提交，基于页面提示推断」，并注明需 step4_api(抓包重放) 或 step6_agent(测试环境执行) 验证。
    绝不编造「已重复扣款」「已幂等」「指数退避 1/2/4s」等未观测结论。
  - 【只读安全护栏】prod 默认只读：除非材料明确写出是测试/staging 且允许写，否则绝不真点不可逆写操作
    （提交/下单/支付/付款/提现/转账/删除/发布/注销/清空/确认兑换）；写操作以 observe_only 只观察提示，不真正完成提交。
    不输入真实凭据，不批量/循环提交，不制造脏数据，截图/抽取文案避开密码/token 明文。
  - confidence.score 在 [0,1]，自我保守评估。
  - 如材料不足（如缺真实可访问 URL 导致无法切档真测），应在 gate_decision 中置 reject_with_report，不要臆造内容。

  【统一报告契约 · 所有 finalize 步骤强制遵守】
  最终步（_5_*）输出必须包含以下五个顶层字段，缺一不可；中间步可以只输出本步关心的子部分。
  ```json
  {
    "verdict": "通过 | 有条件通过 | 不通过",
    "verdict_summary": "一句话给老板看的关键结论 (≤120 字)",
    "risks": [
      {
        "id": "R-001",
        "title": "风险标题",
        "impact": "对业务/用户的影响范围",
        "why": "为什么是风险（基于哪段输入）",
        "severity": "high|medium|low"
      }
    ],
    "blockers": [
      {
        "id": "B-001",
        "title": "阻碍当前阶段继续的硬约束",
        "why_blocking": "为什么必须先处理",
        "what_to_unblock": "需要谁/做什么才能解开",
        "owner_role": "product|backend|frontend|test|devops|security|data",
        "estimated_hours": 0
      }
    ],
    "issues": [
      {
        "issue_id": "<MODULE-AREA-NNNN>",
        "title": "标题",
        "severity": "critical|high|medium|low|info",
        "priority": "P0|P1|P2|P3",
        "module": "出现位置/接口/页面",
        "current_behavior": "现状",
        "expected_behavior": "期望",
        "fix_suggestion": "怎么修",
        "reproduce_steps": ["步骤1", "步骤2"],
        "acceptance_criteria": "怎么验",
        "related_test_cases": ["TC-xxx"],
        "owner_role": "...",
        "estimated_hours": 0,
        "impact_scope": "影响面",
        "evidence": "来自输入材料的具体引用"
      }
    ],
    "cases": [
      {
        "id": "<TC-xxx>",
        "title": "...",
        "priority": "P0|P1|P2|P3",
        "type": "main|exception|boundary|security|perf|compat",
        "preconditions": "...",
        "steps": ["..."],
        "expected": "...",
        "automation_tag": "auto|semi_auto|manual",
        "status": "designed|executed_pass|executed_fail|skipped|blocked"
      }
    ],
    "gate_decision": {"action": "proceed|proceed_with_warning|reject_with_report", "reasons": ["..."]},
    "confidence": {"score": 0.0, "rationale": "..."}
  }
  ```
  - issues 必须按 (severity, priority) 严重度优先级双键排序：critical>high>medium>low>info；同级内 P0>P1>P2>P3。
  - cases 必须按 priority (P0→P3) 排序。
  - blockers 与 risks 区分：blockers 表示"不解开就不能继续"，risks 表示"可能出问题但不阻塞当前流程"。
  - 即使无内容，字段也要保留为空数组 []，不要省略。

  【契约硬约束 v2 · 优先级 / 阻碍 / 证据 / 用例数 / 字段命名】
  - **priority 必填**：每条 issue / case 必须含 `priority`（P0/P1/P2/P3），缺则视作 P2，但 LLM **不应主动省略**。
  - **blocker 严格定义**：只有满足以下任一才能进 blockers，其它一律归 risks 或 issues：
      ① 主流程 / 核心功能不可用 ② 严重安全 / 合规 / 数据正确性风险
      ③ 必须先解决才能继续后续测试（外部依赖未就绪、账号未开通等硬阻塞）
    "一般体验问题、可绕过的小 bug、改进建议" 一律 **不算 blocker**。
  - **evidence 可追溯**：`evidence` 字段必须引用输入材料的**具体段落 / 字段名 / URL / 截图文件名**。
    形如 "PRD 提到..." "需求文档说..." 这种泛指，视为无效证据，会被丢弃。
  - **用例数克制**：用例数量应反映需求复杂度，不要为凑数生成机械组合：
      · P0 主流程用例 ≤ 8 条（覆盖核心 happy path）
      · P1 异常 / 边界用例 ≤ 20 条（按模块聚合，每模块 ≤ 5 条）
      · P2 / P3 用例 ≤ 30 条（仅当输入材料明确暗示长尾需求时输出）
  - **字段命名统一**：用 `type` 而非 `kind` 标注 issue / case 的分类（type 枚举：
    main / exception / boundary / security / perf / compat / state / data / a11y）。
    旧的 `kind` 字段允许保留作为兼容，但 finalize 输出必须用 `type`。
