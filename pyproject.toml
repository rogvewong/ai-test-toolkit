[project]
name = "ai-test-toolkit"
version = "0.1.0"
description = "AI-powered testing toolkit aligned with 8-step SOP and TDR quality standards"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.76",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.19.0",
    "json-repair>=0.25.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
testing = ["pytest>=8.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.1.0", "hypothesis>=6.99.0"]
perf = ["locust>=2.24.0"]
ui = ["playwright>=1.42.0", "Pillow>=10.0.0"]
# 文件解析:上传 PDF/DOCX/XLSX/任意编码文本时用,首页"环境检查"会探测这四个
parsers = ["pypdf>=4.0.0", "python-docx>=1.1.0", "openpyxl>=3.1.0", "chardet>=5.2.0"]
pg = ["sqlalchemy>=2.0.0", "asyncpg>=0.29.0"]
signing = ["cryptography>=42.0"]
dev = ["ruff>=0.3.0", "mypy>=1.9.0", "pre-commit>=3.6.0"]

[project.scripts]
qactl = "apps.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
